name: Diagnose ParkSwap live parking service

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect production routing and API responses
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PARKSWAP_HOST }}
          username: ${{ secrets.PARKSWAP_SSH_USER }}
          password: ${{ secrets.PARKSWAP_SSH_PASSWORD }}
          script: |
            set -eu
            for host in app.parkswap.com parkswap.com; do
              echo "=== $host social config ==="
              curl -ksS --resolve "$host:443:127.0.0.1" --max-time 10 -D - -o /tmp/parkswap-health-body \
                -H 'Device-Id: parkswap-healthcheck' \
                -H 'Device-Type: 3' \
                -H 'Timezone: America/New_York' \
                -H 'Language: en' \
                -H 'Accept: application/json' \
                "https://$host/api/v1/auth/social-config" | sed -n '1,20p'
              sed -n '1,12p' /tmp/parkswap-health-body
              echo "=== $host parking request route ==="
              curl -ksS --resolve "$host:443:127.0.0.1" --max-time 10 -D - -o /tmp/parkswap-health-body \
                -H 'Device-Id: parkswap-healthcheck' \
                -H 'Device-Type: 3' \
                -H 'Timezone: America/New_York' \
                -H 'Language: en' \
                -H 'Accept: application/json' \
                -X POST "https://$host/api/v1/parking/request" | sed -n '1,20p'
              sed -n '1,12p' /tmp/parkswap-health-body
            done
            echo '=== active nginx routing ==='
            nginx -T 2>&1 | grep -E 'server_name|root |location /api|try_files|fastcgi_pass' | tail -80
            echo '=== recent application errors ==='
            find /var/www/html/backend-api/application/logs -type f -name 'log-*.php' -print0 2>/dev/null | xargs -0 -r tail -n 80 | tail -120 || true
