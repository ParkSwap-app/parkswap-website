name: Deploy ParkSwap backend authentication

on:
  workflow_dispatch:

concurrency:
  group: parkswap-production-backend-auth
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out approved release
        uses: actions/checkout@v4

      - name: Validate authentication release
        run: |
          php -l backend-release/application/config/routes.php
          php -l backend-release/application/modules/api_v1/controllers/Auth.php
          php -l backend-release/application/libraries/Social_identity_verifier.php
          grep -Fq "api/v1/auth/social-config" backend-release/application/config/routes.php
          grep -Fq "social_config_get" backend-release/application/modules/api_v1/controllers/Auth.php
          grep -Fq "149543713758-id9bq17lmn8rnrqmnlj5knestr76g3qe.apps.googleusercontent.com" backend-release/application/libraries/Social_identity_verifier.php

      - name: Upload authentication release
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.PARKSWAP_HOST }}
          username: ${{ secrets.PARKSWAP_SSH_USER }}
          password: ${{ secrets.PARKSWAP_SSH_PASSWORD }}
          source: "backend-release/application/config/routes.php,backend-release/application/modules/api_v1/controllers/Auth.php,backend-release/application/libraries/Social_identity_verifier.php"
          target: "/tmp/parkswap-auth-release"
          strip_components: 1
          overwrite: true

      - name: Validate and activate authentication release
        uses: appleboy/ssh-action@v1
        env:
          SUDO_PASSWORD: ${{ secrets.PARKSWAP_SUDO_PASSWORD }}
        with:
          host: ${{ secrets.PARKSWAP_HOST }}
          username: ${{ secrets.PARKSWAP_SSH_USER }}
          password: ${{ secrets.PARKSWAP_SSH_PASSWORD }}
          envs: SUDO_PASSWORD
          script: |
            set -eu
            release=/tmp/parkswap-auth-release
            root=/var/www/html/backend-api
            stamp="$(date +%Y%m%d%H%M%S)"
            test -s "$release/application/config/routes.php"
            test -s "$release/application/modules/api_v1/controllers/Auth.php"
            test -s "$release/application/libraries/Social_identity_verifier.php"
            php -l "$release/application/config/routes.php"
            php -l "$release/application/modules/api_v1/controllers/Auth.php"
            php -l "$release/application/libraries/Social_identity_verifier.php"
            printf '%s\n' "$SUDO_PASSWORD" | sudo -S mkdir -p "/var/backups/parkswap-auth/$stamp"
            for file in application/config/routes.php application/modules/api_v1/controllers/Auth.php application/libraries/Social_identity_verifier.php; do
              printf '%s\n' "$SUDO_PASSWORD" | sudo -S mkdir -p "$root/$(dirname "$file")"
              if [ -f "$root/$file" ]; then
                printf '%s\n' "$SUDO_PASSWORD" | sudo -S cp -a "$root/$file" "/var/backups/parkswap-auth/$stamp/$(printf '%s' "$file" | tr '/' '_')"
              fi
              printf '%s\n' "$SUDO_PASSWORD" | sudo -S install -m 0644 "$release/$file" "$root/$file"
            done
            printf '%s\n' "$SUDO_PASSWORD" | sudo -S nginx -t
            for service in php8.3-fpm php8.2-fpm php8.1-fpm php8.0-fpm php7.4-fpm; do
              if systemctl is-active --quiet "$service"; then
                printf '%s\n' "$SUDO_PASSWORD" | sudo -S systemctl reload "$service"
              fi
            done
            printf '%s\n' "$SUDO_PASSWORD" | sudo -S systemctl reload nginx
            body="$(curl -fsS --retry 5 --retry-delay 2 https://app.parkswap.com/api/v1/auth/social-config)"
            printf '%s' "$body" | grep -Fq '"google"'
            printf '%s' "$body" | grep -Fq '"enabled":true'
            printf '%s' "$body" | grep -Fq '149543713758-id9bq17lmn8rnrqmnlj5knestr76g3qe.apps.googleusercontent.com'
            rm -rf "$release"
