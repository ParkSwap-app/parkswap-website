name: Deploy ParkSwap web app to GoDaddy

on:
  workflow_dispatch:

concurrency:
  group: parkswap-production-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the approved release
        uses: actions/checkout@v4

      - name: Upload web app release
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.PARKSWAP_HOST }}
          username: ${{ secrets.PARKSWAP_SSH_USER }}
          password: ${{ secrets.PARKSWAP_SSH_PASSWORD }}
          source: "static/app/*"
          target: "/tmp/parkswap-web-release"
          strip_components: 2
          overwrite: true

      - name: Validate and activate release
        uses: appleboy/ssh-action@v1
        env:
          SUDO_PASSWORD: ${{ secrets.PARKSWAP_SUDO_PASSWORD }}
        with:
          host: ${{ secrets.PARKSWAP_HOST }}
          username: ${{ secrets.PARKSWAP_SSH_USER }}
          password: ${{ secrets.PARKSWAP_SSH_PASSWORD }}
          envs: SUDO_PASSWORD
          script: |
            set -eu
            test -s /tmp/parkswap-web-release/index.html
            test -s /tmp/parkswap-web-release/app.js
            test -s /tmp/parkswap-web-release/app.css
            printf '%s\n' "$SUDO_PASSWORD" | sudo -S mkdir -p /var/www/html/backend-api/app
            targets="/var/www/html/backend-api/app"
            discovered="$(printf '%s\n' "$SUDO_PASSWORD" | sudo -S find /var/www /home -type f -path '*/app/index.html' \
              ! -path '*backup*' ! -path '*/.git/*' -printf '%h\n' 2>/dev/null | sort -u || true)"
            for target in $discovered; do
              case " $targets " in *" $target "*) ;; *) targets="$targets $target" ;; esac
            done
            for target in $targets; do
              test -d "$target" || continue
              stamp="$(date +%Y%m%d%H%M%S)"
              printf '%s\n' "$SUDO_PASSWORD" | sudo -S mkdir -p "/var/backups/parkswap-web/$stamp"
              printf '%s\n' "$SUDO_PASSWORD" | sudo -S cp -a "$target" "/var/backups/parkswap-web/$stamp/$(printf '%s' "$target" | tr '/' '_')"
              printf '%s\n' "$SUDO_PASSWORD" | sudo -S cp -a /tmp/parkswap-web-release/. "$target/"
              grep -Fq '20260729-auth-map-recovery-6' "$target/index.html"
              grep -Fq 'const API = "/api"' "$target/app.js"
              echo "Activated ParkSwap web release in $target"
            done
            printf '%s\n' "$SUDO_PASSWORD" | sudo -S nginx -t
            printf '%s\n' "$SUDO_PASSWORD" | sudo -S systemctl reload nginx
            rm -rf /tmp/parkswap-web-release
