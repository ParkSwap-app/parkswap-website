name: Repair ParkSwap protected API authentication

on:
  workflow_dispatch:

concurrency:
  group: parkswap-production-backend-auth
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Upgrade JWT decoding without changing account data
        uses: appleboy/ssh-action@v1
        env:
          SUDO_PASSWORD: ${{ secrets.PARKSWAP_SUDO_PASSWORD }}
        with:
          host: ${{ secrets.PARKSWAP_HOST }}
          username: ${{ secrets.PARKSWAP_SSH_USER }}
          password: ${{ secrets.PARKSWAP_SSH_PASSWORD }}
          envs: SUDO_PASSWORD
          script: |
            set -eu
            source=/var/www/html/backend-api/application/core/Common_Service_Controller.php
            candidate=/tmp/Common_Service_Controller.php
            stamp="$(date +%Y%m%d%H%M%S)"
            test -s "$source"
            if grep -Fq "new \\Firebase\\JWT\\Key" "$source"; then
              cp "$source" "$candidate"
            else
              awk '
                index($0, "$decoded =  JWT::decode($authToken") {
                  print "            $jwtSecret = getenv(\047JWT_SECRET_KEY\047);"
                  print "            if (class_exists(\047\\\\Firebase\\\\JWT\\\\Key\047)) {"
                  print "                $decoded = JWT::decode($authToken, new \\Firebase\\JWT\\Key($jwtSecret, \047HS256\047));"
                  print "            } else {"
                  print "                $decoded = JWT::decode($authToken, $jwtSecret, array(\047HS256\047));"
                  print "            }"
                  replaced=1
                  next
                }
                { print }
                END { if (!replaced) exit 42 }
              ' "$source" > "$candidate"
            fi
            grep -Fq "new \\Firebase\\JWT\\Key" "$candidate"
            php -l "$candidate"
            printf '%s\n' "$SUDO_PASSWORD" | sudo -S mkdir -p "/var/backups/parkswap-auth/$stamp/application/core"
            printf '%s\n' "$SUDO_PASSWORD" | sudo -S cp -a "$source" "/var/backups/parkswap-auth/$stamp/application/core/Common_Service_Controller.php"
            printf '%s\n' "$SUDO_PASSWORD" | sudo -S install -m 0644 "$candidate" "$source"
            php -l "$source"
            for service in php8.3-fpm php8.2-fpm php8.1-fpm php8.0-fpm php7.4-fpm; do
              if systemctl is-active --quiet "$service"; then
                printf '%s\n' "$SUDO_PASSWORD" | sudo -S systemctl reload "$service"
              fi
            done
            status="$(curl -ksS --resolve app.parkswap.com:443:127.0.0.1 --max-time 10 \
              -H 'Authorization: Bearer parkswap-route-test' \
              -H 'Device-Id: parkswap-healthcheck' \
              -H 'Device-Type: 3' \
              -H 'Timezone: America/New_York' \
              -H 'Language: en' \
              -H 'Accept: application/json' \
              -F 'location=Production route test' \
              -F 'latitude=40.7580' \
              -F 'longitude=-73.9855' \
              -F 'type=1' \
              -o /tmp/parkswap-auth-response \
              -w '%{http_code}' \
              https://app.parkswap.com/api/v1/parking/request)"
            echo "HTTP $status"
            sed -n '1,80p' /tmp/parkswap-auth-response
            echo '=== recent PHP and application errors ==='
            printf '%s\n' "$SUDO_PASSWORD" | sudo -S sh -c '
              tail -n 160 /var/log/nginx/error.log /var/log/php*-fpm.log 2>/dev/null || true
              find /var/www/html/backend-api/application/logs -type f -name "log-*.php" -print0 2>/dev/null | xargs -0 -r tail -n 120 || true
            ' | tail -220
            test "$status" -lt 500
